spring.application.name=SGComplaint-tomcat
server.port=${SERVER_PORT:8080}

# 별도 지정이 없으면 Eclipse 개발 환경인 local 프로필을 사용합니다.
# 운영 서버는 반드시 SPRING_PROFILES_ACTIVE=prod로 실행해야 합니다.
spring.profiles.default=local

# MyBatis 공통 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.call-setters-on-nulls=true
mybatis.configuration.jdbc-type-for-null=NULL

# 인증번호 공통 정책
sms.verification.code-expiration-seconds=180
sms.verification.resend-cooldown-seconds=60
sms.verification.token-expiration-seconds=600
sms.verification.max-failed-attempts=5
sms.verification.phone-hour-limit=${SMS_PHONE_HOUR_LIMIT:5}
sms.verification.phone-day-limit=${SMS_PHONE_DAY_LIMIT:10}
sms.verification.global-day-limit=${SMS_GLOBAL_DAY_LIMIT:100}

# 첨부파일 요청 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB

# First enable only after the existing DB passes dbCheck and dbBaseline.
# Flyway manages schema history; all application queries remain MyBatis.
spring.flyway.enabled=${DB_MIGRATION_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=false
spring.flyway.ignore-migration-patterns=
spring.flyway.create-schemas=false
spring.sql.init.mode=never
app.database.expected-name=${DB_NAME:sgcomplaint}

# 운영에서는 반드시 충분히 긴 고정 값을 REMEMBER_ME_KEY로 설정합니다.
app.security.remember-me-key=${REMEMBER_ME_KEY:local-development-only-change-me}

# 자동 파기는 운영자가 정책/백업을 확인한 뒤 명시적으로 활성화합니다.
app.retention.cleanup-enabled=${DATA_RETENTION_CLEANUP_ENABLED:false}
app.retention.withdrawn-personal-days=${WITHDRAWN_PERSONAL_RETENTION_DAYS:30}
app.retention.complaint-attachment-days=${COMPLAINT_ATTACHMENT_RETENTION_DAYS:365}
app.retention.batch-size=${DATA_RETENTION_BATCH_SIZE:200}

# Actuator는 health만 공개합니다. 포트와 바인딩 주소는 실행 환경별 설정을 사용합니다.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.diskspace.path=${HEALTH_DISK_PATH:.}
management.health.diskspace.threshold=256MB
