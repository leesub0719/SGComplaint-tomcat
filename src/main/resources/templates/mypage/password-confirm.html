<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="회원정보 보호를 위한 비밀번호 재확인">
    <title>비밀번호 확인 | (주) 서경 마을버스</title>
    <link rel="stylesheet" href="../../static/css/public-layout.css" th:href="@{/css/public-layout.css(v='20260907b')}">
    <link rel="stylesheet" href="../../static/css/mypage.css" th:href="@{/css/mypage.css}">
    <script src="../../static/js/public-layout.js" th:src="@{/js/public-layout.js}" defer></script>
</head>
<body>
<a class="public-skip-link" href="#mypage-content">마이페이지 내용으로 바로가기</a>
<header th:replace="~{fragments/public-layout :: header}"></header>
<section th:replace="~{fragments/public-layout :: subHero('/images/subpages/signup-hero.png', '마이페이지')}"></section>

<main id="mypage-content" class="mypage-page">
    <div class="mypage-shell">
        <aside th:replace="~{mypage/fragments :: sidebar(${activeMyPageMenu})}"></aside>
        <section class="mypage-content-panel password-confirm-panel" aria-labelledby="confirm-title">
            <div class="mypage-heading">
                <span>MEMBER INFORMATION</span>
                <h1 id="confirm-title">비밀번호 재확인</h1>
                <p>회원님의 개인정보를 안전하게 보호하기 위해 비밀번호를 한 번 더 확인합니다.</p>
            </div>

            <form class="password-confirm-form" method="post"
                  th:action="@{/mypage/profile/confirm-password}"
                  th:object="${passwordForm}">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="confirm-member-id">아이디</label>
                <input id="confirm-member-id" type="text" th:value="${employee.empId}" readonly>

                <label for="current-password">현재 비밀번호</label>
                <input id="current-password" type="password"
                       th:field="*{currentPassword}" autocomplete="current-password"
                       placeholder="현재 비밀번호를 입력해 주세요" autofocus>
                <p class="mypage-field-error" th:errors="*{currentPassword}"></p>

                <div class="mypage-form-actions">
                    <button class="mypage-primary-button" type="submit">확인</button>
                    <a class="mypage-secondary-button" th:href="@{/}">취소</a>
                </div>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/public-layout :: footer}"></footer>
</body>
</html>
