<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="(주) 서경 마을버스 회원 로그인">
    <title>로그인 | (주) 서경 마을버스</title>
    <link rel="stylesheet" href="../../static/css/login.css" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="../../static/css/public-layout.css" th:href="@{/css/public-layout.css}">
    <script src="../../static/js/login.js" th:src="@{/js/login.js}" defer></script>
    <script src="../../static/js/public-layout.js" th:src="@{/js/public-layout.js}" defer></script>
</head>
<body>
<a class="skip-link" href="#login-form">로그인 폼으로 바로가기</a>
<header th:replace="~{fragments/public-layout :: header}"></header>
<section th:replace="~{fragments/public-layout :: subHero('/images/subpages/login-hero.png', '로그인')}"></section>

<main class="login-page">
    <a class="login-brand" href="/" th:href="@{/}" aria-label="(주) 서경 마을버스 메인으로">
        <span class="brand-symbol" aria-hidden="true">013</span>
        <span>(주) 서경 마을버스</span>
    </a>

    <section class="login-card" aria-labelledby="login-title">
        <div class="login-heading">
            <h1 id="login-title">로그인</h1>
            <span>가입하신 아이디와 비밀번호를 입력해 주세요.</span>
        </div>

        <div id="login-error" class="alert alert-error" role="alert" th:if="${param.error}">
            아이디 또는 비밀번호가 일치하지 않습니다.
        </div>

        <form id="login-form" method="post" action="/login" th:action="@{/login}">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="credential-box">
                <div class="login-field">
                    <label for="emp-id">아이디</label>
                    <div class="input-wrap">
                        <input id="emp-id" name="empId" type="text"
                               autocomplete="username" maxlength="20"
                               placeholder="아이디를 입력해 주세요" required autofocus>
                        <button id="clear-emp-id" class="input-icon clear-button" type="button"
                                aria-label="아이디 지우기" hidden>×</button>
                    </div>
                </div>

                <div class="login-field password-field">
                    <label for="emp-password">비밀번호</label>
                    <div class="input-wrap">
                        <input id="emp-password" name="empPassword" type="password"
                               autocomplete="current-password"
                               placeholder="비밀번호를 입력해 주세요" required>
                        <button id="toggle-password" class="input-icon password-button" type="button"
                                aria-label="비밀번호 표시" aria-pressed="false">
                            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                <circle cx="12" cy="12" r="2.6"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18M10.6 6.1c.5-.1.9-.1 1.4-.1 6 0 9.5 6 9.5 6a15 15 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.2 3.2-.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <label class="remember-option">
                <input type="checkbox" name="remember-me">
                <span class="checkmark" aria-hidden="true"></span>
                <span>로그인 상태 유지</span>
            </label>

            <button id="login-button" class="login-button" type="submit">로그인</button>
        </form>
    </section>

    <nav class="account-links" aria-label="회원 도움말">
        <a href="/account/find-id" th:href="@{/account/find-id}">아이디 찾기</a>
        <span class="divider" aria-hidden="true"></span>
        <a href="/account/reset-password" th:href="@{/account/reset-password}">비밀번호 찾기</a>
        <span class="divider" aria-hidden="true"></span>
        <a href="/signup" th:href="@{/signup}">회원가입</a>
    </nav>

    <a class="home-link" href="/" th:href="@{/}">← 메인 화면으로 돌아가기</a>
</main>
<footer th:replace="~{fragments/public-layout :: footer}"></footer>
</body>
</html>
