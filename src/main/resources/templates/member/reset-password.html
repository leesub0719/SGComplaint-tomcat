<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="(주) 서경 마을버스 비밀번호 찾기">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="app-context-path" content="/" th:content="@{/}">
    <title>비밀번호 찾기 | (주) 서경 마을버스</title>
    <link rel="stylesheet" href="../../static/css/account-recovery.css" th:href="@{/css/account-recovery.css}">
    <link rel="stylesheet" href="../../static/css/public-layout.css" th:href="@{/css/public-layout.css}">
    <script src="../../static/js/app-context.js" th:src="@{/js/app-context.js}" defer></script>
    <script src="../../static/js/reset-password.js" th:src="@{/js/reset-password.js}" defer></script>
    <script src="../../static/js/public-layout.js" th:src="@{/js/public-layout.js}" defer></script>
</head>
<body>
<a class="skip-link" href="#recovery-main">비밀번호 찾기 내용으로 바로가기</a>
<header th:replace="~{fragments/public-layout :: header}"></header>

<main id="recovery-main" class="recovery-page recovery-page-wide">
    <a class="recovery-brand" href="/" th:href="@{/}" aria-label="(주) 서경 마을버스 메인으로">
        <span class="brand-mark" aria-hidden="true">013</span>
        <span>(주) 서경 마을버스</span>
    </a>

    <section class="recovery-card" aria-labelledby="recovery-title">
        <div class="recovery-heading">
            <span class="eyebrow">ACCOUNT RECOVERY</span>
            <h1 id="recovery-title">비밀번호 찾기</h1>
            <p>회원정보 확인과 휴대전화 인증 후 새 비밀번호를 설정할 수 있습니다.</p>
        </div>

        <ol class="step-indicator password-steps" aria-label="비밀번호 찾기 진행 단계">
            <li class="is-current" data-step-indicator="1"><span>1</span>아이디</li>
            <li data-step-indicator="2"><span>2</span>회원정보</li>
            <li data-step-indicator="3"><span>3</span>본인인증</li>
            <li data-step-indicator="4"><span>4</span>재설정</li>
        </ol>

        <section class="recovery-step is-active" data-step="1">
            <div class="field">
                <label for="reset-emp-id">아이디</label>
                <input id="reset-emp-id" type="text" autocomplete="username" maxlength="20"
                       placeholder="가입한 아이디를 입력해 주세요">
                <p id="id-message" class="field-message" aria-live="polite"></p>
            </div>
            <button id="check-reset-id" class="primary-button" type="button">다음</button>
        </section>

        <section class="recovery-step" data-step="2" hidden>
            <div class="summary-box">
                <span>확인된 아이디</span>
                <strong id="reset-id-summary"></strong>
            </div>
            <div class="field">
                <label for="reset-name">이름</label>
                <input id="reset-name" type="text" autocomplete="name" maxlength="50"
                       placeholder="가입할 때 입력한 이름">
            </div>
            <div class="field">
                <label for="reset-phone">휴대전화 번호</label>
                <input id="reset-phone" type="tel" inputmode="numeric" autocomplete="tel"
                       maxlength="11" placeholder="숫자만 입력해 주세요">
                <p id="identity-message" class="field-message" aria-live="polite"></p>
            </div>
            <button id="request-reset-code" class="primary-button" type="button">인증번호 받기</button>
            <button class="text-button previous-button" type="button" data-previous="1">아이디 다시 입력</button>
        </section>

        <section class="recovery-step" data-step="3" hidden>
            <div class="summary-box">
                <span>인증번호 전송 번호</span>
                <strong id="reset-phone-summary"></strong>
            </div>
            <div class="field">
                <label for="reset-code">인증번호</label>
                <div class="code-wrap">
                    <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code"
                           maxlength="6" placeholder="인증번호 6자리">
                    <span id="reset-timer" class="timer">03:00</span>
                </div>
                <p id="code-message" class="field-message" aria-live="polite"></p>
            </div>
            <button id="verify-reset-code" class="primary-button" type="button">인증번호 확인</button>
            <button id="resend-reset-code" class="text-button" type="button">인증번호 다시 받기</button>
        </section>

        <section class="recovery-step" data-step="4" hidden>
            <div class="field">
                <label for="new-password">새 비밀번호</label>
                <input id="new-password" type="password" autocomplete="new-password" maxlength="72"
                       placeholder="영문과 숫자를 포함한 8~72자">
            </div>
            <div class="field">
                <label for="new-password-confirm">새 비밀번호 확인</label>
                <input id="new-password-confirm" type="password" autocomplete="new-password" maxlength="72"
                       placeholder="새 비밀번호를 다시 입력해 주세요">
                <p id="password-message" class="field-message" aria-live="polite"></p>
            </div>
            <button id="submit-new-password" class="primary-button" type="button">비밀번호 변경</button>
        </section>

        <section class="recovery-step result-step" data-step="5" hidden>
            <div class="success-icon" aria-hidden="true">✓</div>
            <h2>비밀번호가 변경되었습니다</h2>
            <p>새로 설정한 비밀번호로 로그인해 주세요.</p>
            <a class="primary-button button-link" href="/login" th:href="@{/login}">로그인하기</a>
        </section>
    </section>

    <nav class="recovery-links" aria-label="계정 도움말">
        <a href="/login" th:href="@{/login}">로그인</a>
        <span aria-hidden="true"></span>
        <a href="/account/find-id" th:href="@{/account/find-id}">아이디 찾기</a>
        <span aria-hidden="true"></span>
        <a href="/signup" th:href="@{/signup}">회원가입</a>
    </nav>
</main>
<footer th:replace="~{fragments/public-layout :: footer}"></footer>
</body>
</html>
