<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${posting.title + ' | 채용공고'}">채용공고 상세</title>
    <link rel="stylesheet" href="../../../static/css/recruit.css" th:href="@{/css/recruit.css}">
    <link rel="stylesheet" href="../../../static/css/public-layout.css" th:href="@{/css/public-layout.css}">
    <script src="../../../static/js/public-layout.js" th:src="@{/js/public-layout.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/public-layout :: header}"></header>
<section th:replace="~{fragments/public-layout :: subHero('/images/subpages/recruit-notices-hero.png', '채용공고')}"></section>
<main class="recruit-page">
    <div class="application-success" th:if="${param.applied}">지원서가 정상적으로 접수되었습니다.</div>
    <article class="recruit-detail">
        <div class="recruit-detail-heading">
            <span class="recruit-status" th:classappend="${posting.statusCssClass}" th:text="${posting.statusLabel}">접수중</span>
            <h1 th:text="${posting.title}">채용공고 제목</h1>
            <p>접수 기간 <strong th:text="${posting.deadline}">2026-12-31</strong></p>
        </div>
        <section class="recruit-content"><h2 class="sr-only">채용공고 내용</h2><p th:text="${posting.content}">채용에 필요한 상세 정보</p></section>
        <div class="recruit-detail-actions">
            <a class="secondary" th:href="@{/recruit/notices}">목록으로</a>
            <a class="primary" th:if="${posting.open}" th:href="@{/recruit/notices/{no}/apply(no=${posting.postingNo})}">지원하기</a>
            <span class="closed-message" th:unless="${posting.open}">접수가 마감된 공고입니다.</span>
        </div>
    </article>
</main>
<footer th:replace="~{fragments/public-layout :: footer}"></footer>
</body>
</html>
