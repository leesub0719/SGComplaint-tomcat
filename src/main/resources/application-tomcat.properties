# 외부 Tomcat용 프로필입니다. 운영에서는 prod와 함께 활성화합니다.
# 예: SPRING_PROFILES_ACTIVE=prod,tomcat

# 외부 Tomcat의 HTTP/HTTPS Connector와 Context Path는 server.xml 또는
# conf/Catalina/localhost/sgcomplaint.xml에서 관리합니다. server.port와
# server.address는 외부 서블릿 컨테이너가 제어하므로 이 파일에서 지정하지 않습니다.

# 관리 엔드포인트를 별도 임베디드 포트로 열지 않고 배포 컨텍스트 안에서 제공합니다.
# 공개 범위는 application.properties의 health 하나로 제한되어 있습니다.
management.server.port=${MANAGEMENT_PORT:8080}
management.endpoints.web.base-path=/actuator

# 프록시가 전달한 HTTPS/클라이언트 주소 헤더는 Tomcat RemoteIpValve가 검증합니다.
server.forward-headers-strategy=native

# WAR 재배포 시 세션 직렬화 파일을 남기지 않습니다.
server.servlet.session.persistent=false

# 운영 오류 정보는 응답에 노출하지 않고 Tomcat/Spring 로그로만 확인합니다.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
