plugins {
	id 'java'
	id 'war'
	id 'eclipse-wtp'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.transit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	implementation 'org.springframework.data:spring-data-commons'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-mysql'
	// 외부 Tomcat에는 서블릿 컨테이너가 있으므로 WAR 배포 시 Tomcat 런타임은 provided로 둡니다.
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testRuntimeOnly 'com.h2database:h2'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// SOLAPI 문자 발송
	implementation 'com.solapi:sdk:1.0.3'
}

tasks.named('test') {
	useJUnitPlatform()
}
tasks.named('bootWar') {
	archiveFileName = 'sgcomplaint.war'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += '-parameters'
	options.fork = true
}

// Eclipse에서 외부 Tomcat 10.1 개발 서버의 Dynamic Web Module로 인식되도록 합니다.
eclipse {
	project {
		name = 'SGComplaint-tomcat'
	}
	wtp {
		component {
			contextPath = 'sgcomplaint'
			deployName = 'sgcomplaint'
		}
		facet {
			facet name: 'jst.web', version: '6.0'
			facet name: 'jst.java', version: '17'
		}
	}
}

['check', 'baseline', 'info', 'migrate', 'validate'].each { command ->
    tasks.register('db' + command.capitalize(), JavaExec) {
        group = 'database'
        description = 'Run the guarded database migration tool: ' + command
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.transit.SGComplaint.migration.DatabaseMigrationTool'
        jvmArgs '-Dfile.encoding=UTF-8'
        args command
    }
}
